<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Result Processor — SSSIHL COE</title>
    <!-- The SSSIHL emblem in white on the sidebar's navy, so it shows on light and dark browser tabs alike. Rsbuild adds the favicon.ico link itself (public/favicon.ico). -->
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes white.
      // "?theme=light|dark" in the address overrides it for that visit only.
      (function () {
        var theme = null;
        try { theme = new URLSearchParams(location.search).get("theme") || localStorage.getItem("rp-theme"); } catch (e) {}
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
